name: Android Build & Play Store Bundle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build AleClip Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Required release secrets (RELEASE_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD) are not configured!"
            exit 1
          fi
          
          echo "Decoding release upload keystore from repository secrets..."
          echo "$KEYSTORE_BASE64" | base64 -d > aleclip-release.keystore
          
          echo "Verifying keystore with keytool..."
          keytool -list -v -keystore aleclip-release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "${KEY_ALIAS:-aleclip_upload_key}" | grep -E "Alias|Owner|SHA256|Valid"

      - name: Build Signed Android App Bundle (AAB) & APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'aleclip_upload_key' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:bundleRelease :app:assembleRelease --stacktrace

      - name: Verify Release Signatures
        run: |
          echo "=== Verifying Android App Bundle (.aab) with jarsigner ==="
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/*.aab | grep -E "CN=AleClip|jar verified" || jarsigner -verify app/build/outputs/bundle/release/*.aab

          echo "=== Verifying APK signature ==="
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs app/build/outputs/apk/release/*.apk || echo "apksigner checked"

      - name: Upload Release App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: AleClip-Android-AppBundle
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Upload Release APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: AleClip-Android-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14


name: Android Build & Play Store Bundle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build AleClip Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android App Bundle (AAB) & APK
        run: gradle :app:bundleRelease :app:assembleRelease --stacktrace

      - name: Upload Release App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: AleClip-Android-AppBundle
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Upload Release APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: AleClip-Android-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
